name: Build harakat model
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NeMo (CPU)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install "nemo_toolkit[asr]" onnx onnxruntime
      - name: Download model from Hugging Face
        run: curl -fsSL -o model.nemo https://huggingface.co/mohammed/fastconformer-quran-ar/resolve/main/phase3_full/phase3_full_wer0.0014.nemo
      - name: Export ONNX
        run: |
          mkdir out
          python tools/export_harakat.py model.nemo fp32.onnx out/vocab.json
          # Only MatMul weights: quantizing the convolutions (STFT basis included) ruins the output.
          python -c "from onnxruntime.quantization import quantize_dynamic, QuantType; quantize_dynamic('fp32.onnx', 'out/fastconformer_harakat_int8.onnx', weight_type=QuantType.QInt8, per_channel=True, op_types_to_quantize=['MatMul'])"
      - name: Check int8 matches fp32 (Al-Fatiha, Al-Ikhlas)
        run: |
          sudo apt-get install -y -qq ffmpeg
          for a in 001001 001002 001003 001004 001005 001006 001007 112001 112002 112003 112004; do
            curl -fsSL -o $a.mp3 https://everyayah.com/data/Alafasy_128kbps/$a.mp3
            ffmpeg -loglevel error -i $a.mp3 -ac 1 -ar 16000 -f f32le $a.raw
            f=$(python tools/check_harakat.py fp32.onnx out/vocab.json $a.raw | sed 's/^.*-> //')
            q=$(python tools/check_harakat.py out/fastconformer_harakat_int8.onnx out/vocab.json $a.raw | sed 's/^.*-> //')
            echo "$a fp32: $f"
            echo "$a int8: $q"
            [ "$f" = "$q" ] || echo "$a" >> mismatches
          done
          if [ -f mismatches ]; then echo "int8 differs on: $(cat mismatches | tr '\n' ' ')"; exit 1; fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          printf 'Model: mohammed/fastconformer-quran-ar (phase3_full), CC-BY-4.0\nhttps://huggingface.co/mohammed/fastconformer-quran-ar\nConverted to ONNX (CTC branch) and int8-quantized for Sukun.\n' > ATTRIBUTION.txt
          sha256sum * > SHA256SUMS
          ls -l
          gh release delete tarteel-harakat-model-v1 -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create tarteel-harakat-model-v1 * -R "$GITHUB_REPOSITORY" \
            -t "Tarteel harakat model v1" \
            -n "FastConformer Quran (with tashkeel) by mohammed, CC-BY-4.0. ONNX CTC export, int8. See ATTRIBUTION.txt."
